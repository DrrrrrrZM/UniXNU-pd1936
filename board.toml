# UniXNU device repository - vivo iQOO Neo 855 (PD1936 / V1936A)
# Format 2, modelled on the closest existing SM8150 phone port (UniXNU-pclm10,
# same SoC class, same Mu-Silicium firmware route, same QUPv3 SE17 touch wiring).
# Every hardware value below is measured on this unit; see ../hardware-inventory.md
# and ../vendor-scan.md for the method.
schema_version = 2

[board]
name = "pd1936"
soc = "SM8150"
soc_source = "sm8150"
os_profile = "ipados-17.7.11-21H461"
description = "vivo iQOO Neo 855 (V1936A, PD1936), SM8150 v2, 1080x2340 AMOLED @62Hz, UFS 3.x"
kit = "pd1936"

[components]
include = [
  "ArmDTPlatform",
  "ArmCpu",
  "SoftwareAES",
  "AppleKeyStoreState",
  "GopFramebuffer",
  "XnuPrelink",
  "DarwinBoot",
  "RamBlock",
  "ShengUfs",
  "VirtioMmioBlock",
]

[kernel]
defconfig = "pd1936_defconfig"
config_fragments = [
  "arch:configs/common.config",
  "soc:configs/sm8150.config",
  # Applied after the SoC fragment so it can turn ADRENO / LEGACY_DISPLAY back off: the SM8150
  # fragment enables it, but this board has no GPU component/archive yet and the
  # link step would fail on a missing $ADRENO_ARCHIVE.
  "device:configs/pd1936-minimal.config",
  "os:configs/ipados.config",
]
# Same ordering as the reference port: arch, device, soc, os.
patch_series = [
  "arch:patches/xnu/series",
  "device:patches/xnu/series",
  "soc:patches/xnu/series",
  "os:patches/xnu/series",
]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-libpthread-kernel.py",
  "component:AppleKeyStoreState",
  # Strictly read-only SM8150 UFS probe: strips every write path from ShengUfs and
  # adapts its SM8550 constants to this board (host 0x1d84000, ICE 0x1d90000,
  # PHY 0x1d87000, GCC 0x100000 + 0x77000, SMMU stream 0x300). It can enumerate the
  # LUNs and read blocks, so it is enough to reach the root volume; it cannot write.
  "build-pd1936-ufs-block.py",
  "component:VirtioMmioBlock",
  "component:RamBlock",
  "build-storage-bindings.py",
  # Still to write:
  #   "build-pd1936-armcpu.py"        (ArmCpu source transform, see UniXNU-nabu)
]

[device_tree]
source = "device:dts/pd1936.dts"
include_dirs = ["soc:dts"]

[firmware]
# Same Mu-Silicium route as the reference SM8150 phone port. The platform
# package is generated by the preflight script from the stock XBL/DXE inputs
# (UEFIReader) plus the board DSC/FDF kept in uefi-pd1936/.
config = "pd1936"
dsc = "Platforms/VIVO/pd1936Pkg/pd1936.dsc"
fd = "Build/pd1936Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = [
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl",
]
patches = [
  "Resources/MuPatches/AsmMacroLib.patch",
  "Resources/MuPatches/Timer.patch",
]
packages = [
  "{uefi}",
  "{uefi}/Platforms/VIVO",
  "{uefi}/Platforms/Xiaomi",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]
preflight = [
  "scripts/prepare-pd1936-uefi.py",
]

[firmware.defines]
ENABLE_SECUREBOOT = 0
DEVICE_MODEL = 0
SHENG_VENDOR_HW = 0

[bootimg]
# The staged firmware DTB already carries /reserved-memory/cont_splash_region
# (0x9c000000, 36 MiB) and the shellv/uefi windows, so no extra dtb_node
# injection is needed.
dtb = "build/pd1936/pd1936.dtb"

[build]
data_ramdisk = "seed-root.img"

[payload]
volume = "PD1936"
size_mib = 200
loader = "firmware"
title = "UniXNU (iQOO Neo 855)"
kernel_args = [
  "-v",
  "debug=0x14e",
  "keepsyms=1",
  "-enable_kprintf_spam",
  "security-mode-change-enable=1",
  "amfi_get_out_of_my_way=1",
  "pd1936-autoreset=600",
  "native-ufs-root=1",
  "boot-progress=2",
  "build-tag=pd1936-02",
  "kextlog=0xfff",
]

[payload.adt]
chip_id = "8011"

[userdata]
# Verified twice (see ../hardware-inventory.md):
#   /proc/partitions sda19 = 239415244 KiB
#   fastboot partition-size:userdata = 0x3914BF3000 = 245161209856 B
#   = 59853811 sectors of 4096; first_lba from the stock GPT (cache ends 2202631)
first_lba = 2202632
last_lba = 62056442
lba_bytes = 4096

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "pd1936_defconfig"

# PM8150 PON keys (measured: qpnp_pon exposes KEY_POWER only; gpio-keys carries
# the volume keys). Volume key GPIOs are still to be read from the stock DT.
[adt.buttons.u32]
power_kpdpwr = 1
