name: kernel

# Builds the XNU kernel + payload for PD1936 on a macOS runner (full Xcode, which the
# kernel step needs: ld64 / mig / codesign / compression_tool).
#
# Artifacts: kernel/kernel.macho, payload/payload.img, boot/boot.img
#
# NOTE: board.toml [kernel] archives currently selects only the shared components.
# The device driver archives (UFS read-only, display, input) are not written yet, so
# this workflow produces a kernel that reaches DarwinBoot but has no storage driver.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["17", "26", "27"]
        default: "17"

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: checkout device
        uses: actions/checkout@v4
        with:
          path: device

      - name: checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 95ad78129203442c3c14c02336303adbddf8d0a3   # tested working commit (matches the XNU patch series)
          path: UniXNU

      - name: init UniXNU submodules safely
        working-directory: UniXNU
        run: |
          git submodule sync
          for sub in $(git config --file .gitmodules --get-regexp path | awk '{print $2}'); do
            echo "init $sub"
            git submodule update --init --recursive "$sub" || \
              git submodule update --init --remote "$sub" || true
          done

      - name: checkout uefi-sheng
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-pd1936

      - name: tools
        run: |
          brew install dtc llvm lld cmake ninja unifdef mtools blacktop/tap/ipsw
          for t in clang xcodebuild make git ninja cmake unifdef dtc fdtget fdtput \
                   aea compression_tool mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; exit 1; }
          done
          python3 -c "import tomllib"
          # Homebrew keeps these keg-only: the XNU archive scripts call llvm-objcopy etc.
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/lld/bin" >> $GITHUB_PATH

      - name: prepare platform package
        run: |
          # Device build scripts run from the UniXNU tree during the archive stage.
          cp device/scripts/build-pd1936-ufs-readonly.py UniXNU/scripts/
          mkdir -p UniXNU/.cache
          # The upstream 17.x profiles carry patches/xnu/zzz-boot-progress.patch, which
          # no longer applies: its bsd_init.c hunks 4/6 and kern_exec.c hunk 4 reference
          # code that does not exist in xnu-10063.141.1 (bsd_init.c is identical across
          # 141.1 / 121.3 / 101.15). It only adds boot_progress_stage() diagnostics, so
          # drop it from the series instead of re-authoring hunks that upstream owns.
          # BSD sed (macOS) needs a suffix after -i, so filter with grep instead.
          for f in UniXNU/profiles/os/*/patches/xnu/series; do
            grep -v 'zzz-boot-progress' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
            echo "  $f: $(wc -l < "$f") patches"
          done
          python3 device/scripts/prepare-pd1936-uefi.py \
            --uefi uefi-pd1936 --device device --tree UniXNU

      - name: build the stand-in launchd
        run: |
          clang -target arm64-apple-macos11 -nostdlib -O2 -o /tmp/launchd src/hello.c
          codesign -s - -f /tmp/launchd || true
          file /tmp/launchd
          ls -l /tmp/launchd

      - name: build an APFS seed containing /sbin/launchd
        run: |
          rm -f /tmp/seed.dmg device/seed-root.img
          hdiutil create -size 128m -fs APFS -volname PD1936ROOT -format UDRW -o /tmp/seed.dmg
          MP=$(hdiutil attach -nobrowse -readwrite /tmp/seed.dmg | tail -1 | awk -F'\t' '{print $NF}')
          echo "mounted at $MP"
          sudo mkdir -p "$MP/sbin"
          sudo cp /tmp/launchd "$MP/sbin/launchd"
          sudo chmod 755 "$MP/sbin/launchd"
          ls -l "$MP/sbin"
          hdiutil detach "$MP"
          cp /tmp/seed.dmg device/seed-root.img
          ls -l device/seed-root.img

      - name: build kernel, payload, firmware
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          # prepare-xnu-source.py downloads the DriverKit headers through the GitHub
          # API and reads GITHUB_TOKEN/GH_TOKEN (scripts/prepare-xnu-source.py:19).
          # Without it the runner's shared egress IP hits "403 rate limit exceeded".
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 UniXNU/unixnu defconfig pd1936_defconfig -D device
          python3 UniXNU/unixnu fetch -D device
          python3 UniXNU/unixnu status --json -D device || true
          python3 UniXNU/unixnu build kernel -D device --os "${{ inputs.os }}"
          python3 UniXNU/unixnu build payload -D device --os "${{ inputs.os }}" --data-ramdisk device/seed-root.img
          python3 UniXNU/unixnu build firmware -D device --os "${{ inputs.os }}" --uefi uefi-pd1936

      - name: strip kernel symbols to fit the 36 MiB payload budget
        run: |
          K=$(ls UniXNU/out/pd1936/*/*/kernel/kernel.macho | head -1)
          echo "before: $(stat -f%z "$K") bytes"
          # DEBUG kernels carry full DWARF; PD1936's ABL refuses an image larger than ~40 MiB,
          # so the payload has to stay small. Drop debug info first, then all symbols if needed.
          llvm-strip --strip-debug "$K" || llvm-strip -S "$K" || true
          echo "after --strip-debug: $(stat -f%z "$K") bytes"
          if [ "$(stat -f%z "$K")" -gt 26000000 ]; then
            llvm-strip --strip-all "$K" || llvm-strip -s "$K" || true
            echo "after --strip-all: $(stat -f%z "$K") bytes"
          fi
          ls -l "$K"

      - name: assemble boot.img with the payload ramdisk
        run: |
          PAYLOAD=$(ls UniXNU/out/pd1936/*/*/payload/payload.img | head -1)
          python3 device/scripts/make-bootimg.py \
            --shim-source uefi-pd1936/BootShim/BootShim.S \
            --fd uefi-pd1936/Build/pd1936Pkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd \
            --dtb UniXNU/build/pd1936/pd1936.dtb \
            --ramdisk "$PAYLOAD" \
            --out boot.img

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: pd1936-kernel-${{ inputs.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            boot.img
            UniXNU/out/pd1936/*/*/kernel/kernel.macho
            UniXNU/out/pd1936/*/*/payload/payload.img
            UniXNU/out/pd1936/*/*/payload/payload.json
