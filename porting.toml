# Every area carries: findings, evidence, completion level.

schema_version = 1



[identity]

device = "pd1936"

name = "vivo iQOO Neo 855 (V1936A)"

soc = "SM8150"

soc_revision = "v2 (ro.boot.dtb_idx=7 -> SM8150 v2 SoC)"

maintainer = "REQUIRED_MAINTAINER"

repository = "REQUIRED_OWNER/UniXNU-pd1936"



[references]

# Existing SM8150 ports used as the baseline instead of inventing a SoC port.

config_reference = "Aruvelut-123/UniXNU-raphael"

config_reference_why = """

format 2, soc_source=sm8150, arm64-only profile, 1080x2340 AMOLED, 2 porting

records in the device index. Its feeds.toml pins a shared SM8150 source, so the

SoC support is reused rather than re-created.

"""

firmware_reference = "wochgn/UniXNU-guacamole"

firmware_reference_why = """

The only SM8150 port recorded as reaching iOS userland on hardware. It builds

the firmware volume from Project Aloha (SurfaceDuo1Pkg) and packs the boot

image with build-bootimg.py --fd .../SM8150_EFI.fd --dtb <prebuilt dtb>.

"""

other_sm8150_ports = [

  "sxl47/UniXNU-cepheus",

  "c0der88/UniXNU-cepheus",

  "didazhiqian/UniXNU-cepheus1",

  "YangQi0408/UniXNU-cepheus",

  "penYo22/UniXNU-raphael",

  "guowenye/UniXNU-raphael",

  "andromeda (mu_aloha lineage)",

]

inherited_findings = """

* SM8150 (Cortex-A76/A55) has no FEAT_PAuth, so arm64e profiles (iPadOS 26/27,

  macOS 27) cannot run: only arm64 targets such as ipados-17.7.11 / ipados-18.x.

* Touch generation differs per board: raphael is GT9889, PD1936 is GT9886.

* Network differs: raphael carries WCN3990, PD1936 carries QCA6390.

* Both ports keep kernel/root on the same build ID; never mix Darwin versions.

"""



[bootloader_route]

source = "coolapk @AuroraXL - adding fastboot boot + UEFI bring-up on iQOO Z8 (MT6896)"

applicable = "methodology only"

reasoning = """

That write-up patches MTK LK: payload injected into an executable hole at 0x1880,

five branch patches (fastboot_register, two storage_image_loader call sites, the

dtbo overlay call, the bootconfig call) and a magic slot at LK+0xf3100.

PD1936 is Qualcomm: its bootloader is the EDK2-based ABL, self-reported as

`kernel:uefi`, and the chain PBL->XBL->ABL is signature-verified (secure:yes with

a securebootkeyhash). Patching abl.elf is therefore not an option, and it is not

needed: on Qualcomm the ABL loads the kernel field of the boot image and jumps to

it, which is exactly what BootShim expects.

Transferable items adopted here:

  1. kernel = gzip(BootShim + FD), with the FD at its compile-time base

     (ours: 0x9FC00000 / 0x300000 from the XBL memory map).

  2. A field-constraint table for the boot image (page, kernel_addr, ramdisk_addr

     nonzero, DTB offset = page + align(kernel), dtb_size == FDT totalsize,

     name prefix) - ours is in tools/mkbootimg_pd1936.py.

  3. Verify on the host before flashing. This ABL has no `fastboot boot`, so every

     attempt costs a NAND write; the packer therefore round-trips and validates

     its own output (self-test PASS).

"""



[verification]

tool = "tools/mkbootimg_pd1936.py"

checks = [

  "page alignment and the 96 MiB partition limit",

  "ANDROID! magic, header v2, page 4096, header_size 4096",

  "ramdisk_size == 0 and ramdisk_addr != 0 rule",

  "DTB magic at page + align(kernel_size) and dtb_size == FDT totalsize",

  "kernel field decompresses as gzip and splits into BootShim + FD of exact size",

  "resolved kernel_addr / tags_addr / dtb_addr printed for review",

]

status = "packer + verifier implemented and self-tested; waiting for the real BootShim and FD"

blocked_on = "mu_aloha_platforms / Mu-Silicium and UniXNU sources (GitHub unreachable from this host)"



[platform]

completion = "source-reviewed"

findings = """

Stock DTB idx7 = qcom,sm8150 v2, 8 CPUs (4x A55 + 4x A76), GICv3 @0x17a00000,

timer 19.2 MHz, PSCI smc. /memory carries a zero reg on stock and is patched by

the bootloader, so the handoff window is taken from the XBL memory map instead:

Kernel 0xC0000000+0x07800000, Display Reserved 0x9C000000+0x02400000,

DXE Heap 0x99E00000+0x01C00000, FV Region 0x9F800000, ABOOT FV 0x9FA00000,

UEFI FD 0x9FC00000+0x00300000.

"""

evidence = ["extract/pd1936-stock-dts.txt", "extract/xbl-memmap.txt", "hardware-inventory.md"]



[storage]

completion = "in-progress"

findings = """

ufshc@1d84000: reg 0x1d84000+0x2500, 0x1d90000+0x8000; GIC SPI 265.

ufsphy_mem@1d87000: 0xda8. ICE (qcom,ice) @0x1d90000.

Root geometry measured on device (/proc/partitions):

  sda = 62056448 sectors of 4096 (248225792 KiB)

  sda19 userdata = 239415244 KiB = 59853811 sectors -> first_lba 2202632,

  last_lba 62056442 (5 sectors left for the backup GPT at the tail).

  Single slot, no A/B; vendor/product live behind dm-0/dm-1 (dynamic partitions).

Controller capability observed in sysfs (root shell):

  /sys/devices/platform/soc/1d84000.ufshc/ exposes host0, health_descriptor,

  devfreq, max_bus_bw, clkscale_enable, hibern8_on_idle_*, spm_lvl, rpm_lvl,

  latency_hist, ufs_io_stats, ufshpb_lu0, ufstw_lu0.

UFS DEVICE IDENTIFIED: Samsung KLUEG8UHDB-C2D1 (128 GB), scsi rev 0900, 9 LUNs.

CORRECTION: this is a UFS 3.x class part, not UFS 2.1 as the marketing spec

suggests. HPB (ufshpb_lu0) and write-booster (ufstw_lu0) nodes only make sense on

UFS 3.x, and the model string confirms it. Consequences:

  * link training target is HS-G4 (UFS 3.0/3.1), not HS-G3

  * HPB / write booster descriptors exist and may need explicit disabling when

    the XNU side takes over the host, otherwise the link state machine differs

  * the ShengUfs "reference firmware leaves HS-G5 Rate A" note is irrelevant here

CORRECTION recorded earlier: the UFS host *base* matches SM8550's slot

(0x1d84000) but host length (0x2500 vs 0x3000), PHY (0x1d87000/0xda8 vs

0x1d80000/0x2000) and clock tables differ. Only ShengUfs's access model

transfers; PHY/clocks/SMMU/link must be SM8150-specific.



UEFI-SIDE MEASUREMENTS (through the framebuffer DEBUG console, 2026-11):

  * the ABL leaves the controller ENABLED and its transfer list RUNNING:

      0x34 CONTROLLER_ENABLE = 1

      0x60 TRANSFER_REQ_LIST_RUN_STOP = 1

      0x30 CONTROLLER_STATUS = 0x0000010F

      0x38..0x48 UIC error codes = 0

      0x08 UFS_VERSION = 0x00000300  -> UFSHCI 3.0 (offsets from Linux ufshci.h)

    so no PHY init, no clock enable and no HCI reset is required.

  * UTRL is CPU-readable at 0x9FFAE000 (0x50 BASE_L = 0x9FFAE000, 0x54 BASE_H = 0);

    0x70 TASK_REQ_LIST_BASE_L = 0x9FFAF000.

  * UTRL[0] points at UTRD 0x05000000, which is NOT CPU-accessible: unmapped it

    raises a translation fault (ESR 0x96000006, FAR 0x05000000), and after adding

    it to the memory map as normal memory the read hangs. A UTRD in CPU-writable

    DRAM is therefore the only option, subject to the SMMU.

  * SMMU is active: IDR0=0x00250406 (SMMU-500), IDR1=0, GBPA=0x00005555,

    GFSR=0x00000039 (faults recorded). Reading 0x15009800 hangs because the

    register window ends at 0x15000FFF; the S2CR slot for stream 0x300 is unknown.

  * WHY THIS MATTERS: the boot image cannot carry the payload (ramdisk_size must be

    0; kernel field tolerates only ~3-4 MiB), so storage access is the only route.


UEFI DMA VERDICT (2026-11-17, six builds): the controller cannot DMA our descriptors.
  * register access is fine: 0x50/0x54/0x60 accept our writes and read back, and ringing the
    door bell with the transfer list STOPPED is harmless (markers A and B print).
  * the hang happens only once the list is started and the bell is rung again (marker C),
    i.e. when the controller DMA-fetches the UTRD.
  * tried and all hang at that step: buffers in the DXE pool, in 0x9FFA8000/0x9FFA9000/
    0x9FFAA000, an inline UTRD inside ABL's UTRL page 0x9FFAE000 using UFSHCI 3.0 semantics
    (utrd = base + slot*32, offsets in 32-bit words, per QEMU's model), UTRL base at
    0x9FFAF000 with a 0x5C list-clear, and S2CR[0x300] forced to BYPASS.
  * SMMU window is readable at 0x15000000, S2CR[n] = 0xC00 + n*4, type at bits 17:16:
    S2CR[0x300] = 0x00000001 (type 0 = fault); writing 0x00010001 (bypass) changed nothing.
CONCLUSION: the DMA path was closed at hand-off (storage stays owned by ABL/TZ, HLOS would
reach it through SCM). Firmware-side UFS is therefore blocked until an SCM interface or a
known-good precedent exists.

SCM VERDICT (same day, direct smc #0 from the firmware):
  IS_CALL_AVAIL(QCOM_SCM_SVC_MP=0x0C, QCOM_SCM_MP_RESTORE_SEC_CFG=0x02) returned x0=0, x1=1,
  i.e. the TZ does implement it. But RESTORE_SEC_CFG was rejected for every device id 1..20
  with x0=0xFFFFFFFFFFFFFFFE (-2) and S2CR[0x300] never changed, including ids unrelated to
  storage (1=MDSS, 18=GFX). The refusal is about the caller, not the id: the call is reserved
  for the secure world. Together with the SMMU quirk (firmware turns S2CR BYPASS writes into
  FAULT) this closes the firmware-side UFS path: READ(10) itself needs no secure world, but
  making its DMA legal does, and that is refused.

FINAL ISOLATION (same day): controller command engine verified alive - UIC_CMD_DME_GET
completed on the first poll after a working W1C clear of IS. All UFS clocks report not-gated
(0x77010/14/18/1c/58/5c/90/ac/c0/8c000, core_clk=0x4221), UFS_PHY_BCR=0 (not in reset),
GDSCR low byte 0 (not collapsed). The live device tree shows ufshc@1d84000 has NO iommus
property, so the earlier S2CR work targeted the wrong block. SCM IS_CALL_AVAIL says
RESTORE_SEC_CFG exists (x1=1) but every device id 1..20 is refused with -2. The only step
that fails is the controller DMA-fetching a UTRD (door bell while the list is stopped is
harmless; starting the list and ringing hangs the device). Conclusion: the UFS master's
access to HLOS memory is fenced by platform memory protection (XPU/DDR, secure-world
configured). G1 is blocked by the platform, not by missing driver code.

VENDOR BINARY EXPERIMENT: this device's own UEFI driver set is public
(Project-Aloha/UEFIFirmwareBackup, iqoo-pd1936: xbl.elf, APRIORI.inc, DXE.inc and 53 signed
QcomPkg drivers incl. UFSDxe.efi). It contains no XhciDxe, so the other SM8150 ports are not
reading data from a USB stick - they reuse Qualcomm's UFSDxe. Three attempts here:
(a) UFSDxe alone -> returns ERROR: C90000002:V03000007 IO (binds nothing);
(b) UFSDxe + 17 platform drivers after CpuDxe -> ChipInfoDxe hangs, black screen, reset;
(c) same set in the vendor APRIORI order (Scm/Tz first) -> ScmDxeLA hangs, black screen, reset.
Conclusion: these are XBL userspace binaries that assume XBL's SMEM/shm-bridge/TZ runtime,
which a BootShim payload does not provide. Vendor binaries are recorded as a reference for
driver order, not as a drop-in solution.

USB HOST RESULT: dwc3 accepts host role (GCTL PrtCapDir read back 1), XHCI reports 1.1 with
PP=1 and PLS=5 (RxDetect), and XhciDxe/UsbBusDxe/UsbMassStorageDxe all bind. What is missing is
VBUS: CCS stays 0 and disks stay dark. The device tree puts VBUS on SPMI (PM8150 GPIO9
usb2_vbus_boost, PM8150B smb5 otg). SPMI reads work from the firmware (arbiter v5, APID map
entry holds the PPID at bits[19:8], obsrvr + 0x10000*ee + 0x80*apid, command
(opc<<27)|((addr&0xFF)<<4)|bc), but writes through every APID mapped to the GPIO9 page and every
write opcode are dropped - the same 'apid write_ee != our ee' rule that Linux enforces. Software
VBUS is therefore closed; only an externally powered hub or a self-powered drive can prove the
USB channel.

SESSION 2026-11-17 SUMMARY: boot chain, framebuffer console and XNU CI build all fine. Storage is
closed: the UFS controller answers UIC commands and its clocks/reset/PHY are up, but the first
descriptor fetch hangs the bus; there is no iommus binding to fix, RESTORE_SEC_CFG is implemented
yet refuses every device id, and the device's own signed UFSDxe (public via
Project-Aloha/UEFIFirmwareBackup) cannot run outside XBL - its real DEPEX was recovered but the
infrastructure drivers hang first. USB is the only physically plausible channel left: dwc3 accepts
host role, XHCI reports 1.1 with PP=1/PLS=5, and the mass-storage stack binds, but VBUS is absent
because SPMI writes are dropped (arbiter v5 reads work; every APID mapped to the PM8150 GPIO9 page
rejects writes). SCM exposes 120 calls; the memory-protection ones reject real arguments with -5,
except SVC_SMMU_PROGRAM 0x02 which answered +4 and is awaiting a 12-vector argument sweep.

SCM VERDICT (2026-11-18): the SVC_SMMU_PROGRAM sweep (12 vectors, arg counts 0..6, SIDs 0/0x300)
produced no x0=0, and CP_SMMU_APERTURE_ID / MP_ASSIGN / 0x0E / 0x0F / 0x23 are all rejected. The
only accepted call is 0x0C/0x03 IOMMU_SECURE_PTBL_SIZE, which merely reports sizing. No legal SCM
call lifts the memory fence. Also recorded: hand-written `smc #0` in a DEBUG-heavy driver asserts
in DebugLib because the TZ return path is not reflected in the asm clobber list - use
ArmSmcLib.ArmCallSmc() instead.

XBL RE RESULT (2026-11-18): the SCM transport in xbl.elf is
ScmDxe_QcomScmProtocol_Function7 -> sub_100F29FC -> sub_100F373C, which loads x2..x5 from the args
array and issues SMC #0 with x0 = fnid|0x40000000 and x1 = arginfo (arg count in the low nibble).
Call sites show fnid = 0x02000000 | (svc<<8) | cmd (owner SIP), which is exactly what our own
firmware built. 39 functions reference gQcomScmProtocol and they use svc 0x06 (INFO), 0x08 and 0x13
(LMH) only - no SVC_MP (0x0C) and no SVC_SMMU_PROGRAM (0x15) call exists in XBL's UEFI phase, so
the memory protection is configured by the TZ boot flow, not here. There is therefore no reference
argument set to copy, which closes the legal-SCM route with evidence.
"""

evidence = ["adb /proc/partitions", "adb /sys/devices/platform/soc/1d84000.ufshc/",

            "adb /sys/class/scsi_device/*/device/model", "extract/xbl-memmap.txt",

            "firmware console: UFSHCI register dump (docs/ufs-bringup.md)",

            "firmware console: UTRL/UTMRL words, SMMU IDR0/GBPA/GFSR",

            "Synchronous Exception dump at FAR=0x05000000"]

pending = ["queue one SCSI READ(10) from our own UTRL/UTRD in CPU-writable DRAM",

           "verdict: OCS==0 (path works) / OCS error + GFSR growth (patch S2CR for stream 0x300 to bypass) / never completes (re-check UFSHCI 3.0 sequencing)",

           "read-only BlockIo driver, placed in UniXNU-sm8150-common",

           "format cache as FAT16 with EFI/UniXNU/Payloads/(kernel.macho, adt, trustcache)",

