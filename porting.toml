backlight_analysis = """

Two raw backlight devices, both type=raw (register-backed, no platform/firmware glue):

  /sys/class/backlight/backlight         max 4095, current 4095

  /sys/class/backlight/panel0-backlight  max 1023, current 0

Reading: 4096 levels = 12-bit scale, 1024 levels = 10-bit scale.

This matches an OLED driven by DSI commands, not a PMIC WLED block:

  panel0-backlight (10-bit) -> panel DBV (DSI 0x51), 0 while the panel runs in

                               its DC-dimming state

  backlight        (12-bit) -> DC dimming / ACL level, 4095 = no dimming

